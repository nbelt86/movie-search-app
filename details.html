<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Movie Search</h1>
    <a href="favorites.html" id="favorites-link">&#9733; My List (<span id="favorites-count">0</span>)</a>
  </header>

  <a href="index.html" id="back-link">&larr; Back to search</a>

  <section id="movie-detail">
    <img id="detail-poster" src="" alt="">
    <div id="detail-info">
      <div class="detail-title-row">
        <h2 id="detail-title"></h2>
        <button id="detail-favorite-btn" class="favorite-btn" aria-label="Toggle favorite">&#9734;</button>
      </div>
      <p id="detail-meta"></p>
      <p id="detail-rating"></p>
      <p id="detail-plot"></p>
      <p id="detail-director"></p>
    </div>
  </section>

  <script src="favorites.js"></script>
  <script src="details.js"></script>
</body>
</html>
